[project]
name = "voice-openai-server"
version = "1.0.0"
description = "A simple STT & TTS OpenAI-compatible API server"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "kokoro>=0.9.2",
    "librosa",
    "numpy",
    "protobuf",
    "python-multipart",
    "resampy",
    "soundfile",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers[sentencepiece,torch]>=5.22.1",
    "uvicorn",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]
torchaudio = [
  { index = "pytorch-cpu" },
]
